<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prompt &amp; Skills</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button id="menu-toggle" class="menu-toggle" type="button" aria-label="打开菜单" aria-expanded="false">☰</button>

  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <span class="site-title">Prompt &amp; Skills</span>
      <button id="sidebar-close" class="sidebar-close" type="button" aria-label="关闭菜单">×</button>
    </div>
    <nav class="nav" aria-label="内容类型">
      <button class="nav-item is-active" type="button" data-view="prompts" aria-current="page">Prompts</button>
      <button class="nav-item" type="button" data-view="skills">Skills</button>
    </nav>
    <nav id="nav-groups" class="nav-groups" aria-label="分类导航" hidden></nav>
  </aside>
  <div id="scrim" class="scrim" hidden></div>

  <main class="content">
    <header class="content-header">
      <h2 id="view-title">Prompts</h2>
      <span id="view-count" class="view-count"></span>
      <div class="search">
        <input id="search" class="search-input" type="search" placeholder="搜索标题或正文"
          aria-label="搜索标题或正文" autocomplete="off">
      </div>
    </header>
    <nav id="group-nav" class="group-nav" aria-label="分类快捷跳转" hidden></nav>
    <p id="status" class="sr-only" role="status"></p>
    <div id="groups" class="groups" tabindex="-1"></div>
  </main>

  <div id="modal" class="modal" hidden>
    <div id="modal-box" class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button id="modal-close" class="modal-close" type="button" aria-label="关闭">×</button>
      <h3 id="modal-title" class="modal-title"></h3>
      <span id="modal-category" class="modal-category" hidden></span>
      <div id="modal-body" class="modal-body" tabindex="0" role="document" aria-label="正文"></div>
      <div id="modal-actions" class="modal-actions"></div>
    </div>
  </div>

  <script src="vendor/marked.min.js"></script>
  <script src="vendor/dompurify.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
